services:
  - type: web
    name: shayan-banquet-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: server
    autoDeploy: true
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://bookingmanagementsystem-nine.vercel.app,https://shayanshyanbanquet.vercel.app
      - key: DEMO_PASSWORD
        sync: false
